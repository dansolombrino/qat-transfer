[project]
name = "qat-transfer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.10.0",
    "datasets>=2.19.1",
    "dotenv>=0.9.9",
    "hydra-submitit-launcher>=1.2.0",
    "kaleido>=1.2.0",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "open-clip-torch>=3.3.0",
    "pillow>=11.3.0",
    "plotly>=6.7.0",
    "requests>=2.32.0",
    "rich>=14.3.3",
    "rouge-score>=0.1.2",
    "sacrebleu>=2.5.1",
    "safetensors>=0.6.2",
    "sentence-transformers>=5.1.2",
    "tabulate>=0.9.0",
    "timm>=1.0.26",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "tqdm>=4.66.5",
    "transformers==4.57.6",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
