hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/text/ilharco_automodelforsequenceclassification/000_baselines/evaluate_rex
    subdir: ${sanitize_hf:${model_name}}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_mgn=${max_grad_norm}_bs=${batch_size}_ml=${max_length}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
max_grad_norm: ???
max_length: ???
seed: ???
gpu: ???
limit_num_epochs: null
limit_num_batches: null
log_to_file: false

rex:
  skip_modules: ???    # list of child-module attribute names to exclude, e.g. [classifier]
  bits: ???            # int
  granularity: ???     # "tensor" or "channel"
  order: ???           # int, >= 1 (1 = plain PTQ)
  sparsity: ???        # float in [0, 1], channel sparsity for correction terms
