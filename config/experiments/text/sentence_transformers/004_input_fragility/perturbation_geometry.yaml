hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/text/sentence_transformers/004_input_fragility/perturbation_geometry
    subdir: ${model_name}/${dataset_name}/ptq=bits=${ptq.bits}_gran=${ptq.granularity}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: 32
max_length: 128
seed: 2038
gpu: ???

# documents are subsampled: the geometry is a per-embedding property, not a corpus property,
# so a few thousand rows is plenty and keeps the run short
max_docs: 4000
max_queries: 2000

ptq:
  skip_modules: []
  bits: ???
  granularity: group_128
  method: rtn
  calib_batches: 4
