    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/rex/rex_transfer
    subdir: ${model_family}/${model_name}/src_seed=${source.seed}/tgt_seed=${target.seed}

model_family: ???
