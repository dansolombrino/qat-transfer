hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_hf_clip/004_input_fragility/gap_allocation_clip
    subdir: ${model_name}/ptq=bits=${ptq.bits}_gran=${ptq.granularity}/seed=${seed}

model_name: ViT-B-32
pretrained: openai
dataset_path: nlphuji/flickr30k
split: test
caption_field: caption
max_images: 4000
max_queries: 2000
batch_size: 64
seed: 2038
gpu: ???
ptq:
  skip_modules: []
  bits: ???
  granularity: group_128
  method: rtn        # "rtn" | "gptq" | "awq"
  percdamp: 0.01     # gptq only
  awq_grid: 20       # awq only

# allocation
avg_bits: 3.5          # fractional budget; at an integer average uniform is the only allocation
bit_choices: [3, 4]
n_random: 3            # random splits at the same budget, the honest control
calib_queries: 128     # calibration slice for the sensitivity measurement
calib_images: 512
