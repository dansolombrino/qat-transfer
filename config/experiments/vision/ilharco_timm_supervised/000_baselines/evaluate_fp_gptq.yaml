hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/000_baselines/evaluate_fp_gptq
    subdir: ${model_name}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
limit_num_epochs: null
limit_num_batches: null
log_to_file: false

gptq:
  skip_modules: ???  # list of child-module attribute names to exclude from GPTQ, e.g. [head]
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
  sym: true          # symmetric quantization (asymmetric not yet supported)
  num_calibration_samples: 128
