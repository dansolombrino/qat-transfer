hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/002_quant_steering/evaluate_steered_ptq
    subdir: ${model_name}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/ptq=bits=${ptq.bits}_gran=${ptq.granularity}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
limit_num_epochs: null
limit_num_batches: null
log_to_file: false

ptq:
  skip_modules: ???  # list of child-module attribute names to exclude from PTQ, e.g. [head]
  bits: ???          # int (e.g. 4 or 8)
  granularity: ???   # "tensor" or "channel"

steering:
  methods: ???        # list, subset of [mean_diff, contrastive_svd]
  block_sweep: ???    # "all" or list[int]. In single mode: each is a candidate to test.
                      # In tied_multi mode: THE set of blocks to inject at simultaneously.
  alpha_grid: ???     # list[float]; include 0.0 to record the plain-PTQ baseline
  vectors_path: null  # absolute path; if null, derived from the cfg above
  token_mode: all     # "all" (broadcast α·v to every token) or "cls" (only at position 0)
  injection_mode: single  # "single" (sweep over block_sweep, one block at a time) or
                          # "tied_multi" (one shared α at every block in block_sweep)
