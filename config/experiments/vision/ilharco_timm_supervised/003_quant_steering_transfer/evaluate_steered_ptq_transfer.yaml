hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/003_quant_steering_transfer/evaluate_steered_ptq_transfer
    subdir: ${model_name}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/ptq=bits=${ptq.bits}_gran=${ptq.granularity}/seed=${seed}

model_name: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
limit_num_epochs: null
limit_num_batches: null
log_to_file: false

ptq:
  skip_modules: ???  # list of child-module attribute names to exclude from PTQ, e.g. [head]
  bits: ???          # int (e.g. 4 or 8)
  granularity: ???   # "tensor" or "channel"

steering:
  methods: ???       # list, subset of [mean_diff, contrastive_svd]
  block_sweep: ???   # "all" or list[int]
  alpha_grid: ???    # list[float]; include 0.0 to record the plain-PTQ baseline
  vectors_path: ???  # absolute path to universal_steering_vectors.pt from combine_steering_vectors.py
