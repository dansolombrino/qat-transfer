hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_timm_supervised/003_qat_transfer_activ/qv_transfer
    subdir: ${model_name}/seed=${target.seed}/qat=bits=${qat.bits}_gran=${qat.granularity}/ptq=bits=${ptq.bits}_gran=${ptq.granularity}/strategy=${steering_strategy}/reduce=${token_reduce}/steer=alpha=${steer.alpha}_metric=${steer.best_metric}

model_name: ???
batch_size: ???
eval_split: ???        # "val" or "test"
limit_num_batches: null
log_to_file: false

# Shared training hyperparameters used to locate ALL checkpoints
# (fp_source, qat_source, fp_target, qat_target) and the steering cache.
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???

gpu: ???

# Activation-steering controls.
#   steering_strategy: which taps to inject at; MUST match the value used at
#     precompute (it is part of the steering cache path). per_block implemented;
#     per_linear / per_attn_mlp are TODO stubs in src/vision/steering.py.
#   token_reduce: how the cached per-token [tokens, dim] vector is applied:
#     "mean" -> collapse to [dim] (broadcast over tokens), "per_token" -> keep.
steering_strategy: ???      # per_block | per_linear | per_attn_mlp
token_reduce: ???           # per_token | mean

source:
  dataset_names: ???       # list of source/donor dataset names to iterate over internally
  seed: ???
  limit_num_epochs: null   # null -> DATASET_NAME_TO_EPOCHS[dataset_name]

target:
  dataset_names: ???       # list of target/receiver dataset names to iterate over internally
  seed: ???
  limit_num_epochs: null   # null -> DATASET_NAME_TO_EPOCHS[dataset_name]

# Used to LOCATE the QAT source/target checkpoints AND recorded in results JSON.
qat:
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
  skip_modules: ???  # list of child-module attribute names that were skipped during QAT training, e.g. [head]

steer:
  alpha: ???         # float scaling coefficient, or "best" to read from best_alpha_*.json on disk
  best_metric: null  # metric key for best_alpha lookup; required when alpha=best (e.g. val_accuracy_fp_head_ptq)

# FINAL eval PTQ of the steered model.
ptq:
  skip_modules: ???  # list of child-module attribute names to exclude from PTQ, e.g. [head]
  bits: ???          # int
  granularity: ???   # "tensor" or "channel"
