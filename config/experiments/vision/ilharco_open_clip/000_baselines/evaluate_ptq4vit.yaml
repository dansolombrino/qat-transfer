hydra:
  searchpath:
    - file://${oc.env:PWD}/config
  sweep:
    dir: logs/config/experiments/vision/ilharco_open_clip/000_baselines/evaluate_ptq4vit
    subdir: ${model_name}__${pretrained}/${dataset_name}/optim=adamw_lr=${lr}_wd=${wd}_ls=${ls}_wl=${wl}_mgn=${max_grad_norm}_bs=${batch_size}/seed=${seed}

model_name: ???
pretrained: ???
dataset_name: ???
batch_size: ???
lr: ???
wd: ???
ls: ???
wl: ???
max_grad_norm: ???
seed: ???
gpu: ???
limit_num_epochs: null
limit_num_batches: null
log_to_file: false

ptq4vit:
  skip_modules: ???            # list[str] — e.g. [classification_head]
  bit: ???                     # int — quantization bit-width (applied to w and a)

  # Calibrator selection
  calibrator: ???              # str — "hessian" or "basic"
  calib_num_samples: ???       # int — total calibration samples from val set
  calib_batch_size: ???        # int — DataLoader batch size for calibration
  hessian_batch_size: ???      # int — inner batch size for Hessian backward passes

  # PTQSL hyperparameters
  metric: ???                  # str — "hessian", "cosine", "L2_norm", "pearson", etc.
  search_round: ???            # int — number of alternating search rounds
  eq_alpha: ???                # float — lower bound of interval search range
  eq_beta: ???                 # float — upper bound of interval search range
  eq_n: ???                    # int — number of candidate intervals to search

  # Linear-specific PTQSL granularity
  n_V: ???                     # int — vertical partitions for weight (tripled for QKV automatically)
  n_H: ???                     # int — horizontal partitions for weight
  n_a: ???                     # int — activation partitions

  # MatMul-specific PTQSL granularity
  n_G_A: ???                   # int — group partitions for matmul input A
  n_V_A: ???                   # int — vertical partitions for A
  n_H_A: ???                   # int — horizontal partitions for A
  n_G_B: ???                   # int — group partitions for matmul input B
  n_V_B: ???                   # int — vertical partitions for B
  n_H_B: ???                   # int — horizontal partitions for B

  # Behavioral flags
  no_softmax: false            # bool — disable SoS for score-value matmul
  no_postgelu: false           # bool — disable PostGelu for MLP_2 (c_proj)
  bias_correction: true        # bool — enable bias correction in linear layers
